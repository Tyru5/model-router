[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist). Regenerate CI after edits: `dist generate`.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Unix only (PTYs, termios). Static musl builds run on any Linux.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Install the short `mr` alias next to model-router
bin-aliases = { model-router = ["mr"] }
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Homebrew formula is attached to each release. Tap publishing lives in
# .github/workflows/homebrew.yml (runs only when HOMEBREW_TAP_TOKEN is set).
formula = "model-router"
