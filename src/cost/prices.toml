# Built-in model prices: ESTIMATES; verify with your provider.
# USD per 1M tokens. Lists change and providers discount or surcharge
# (long context, batch, regional endpoints); costs computed from this table
# are labelled "table". Override any entry with [pricing."model-id"] in a
# config file or [models."model-id"] in ~/.config/model-router/pricing.toml.
# cache_read defaults to 0.1 x input and cache_write to 1.25 x input when omitted.
as_of = "2026-11-05"

# Harness aliases priced as the model they currently select.
[aliases]
opus = "claude-opus-5-5"
opusplan = "claude-opus-5-5"
sonnet = "claude-sonnet-5-5"
haiku = "claude-haiku-5-5"
fable = "claude-fable-5-1"

