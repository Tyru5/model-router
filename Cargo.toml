[package]
name = "model-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A terminal workflow router for agentic harnesses and models"
license = "MIT"
repository = "https://github.com/Tyru5/model-router"
homepage = "https://github.com/Tyru5/model-router"
readme = "README.md"
keywords = ["cli", "tui", "ai", "agents", "workflow"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
# The default Unix reader spins on EOF after a PTY closes, starving shutdown.
# This backend breaks its read loop on EOF and preserves the poll timeout.
crossterm = { version = "0.28", features = ["use-dev-tty"] }
directories = "6"
fs2 = "0.4"
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
# preserve_order: merged OpenCode config keeps last-match permission rule order.
serde_json = { version = "1", features = ["preserve_order"] }
shell-words = "1"
strip-ansi-escapes = "0.2"
tempfile = "3"
toml = "0.8"
tui-textarea = "0.7"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.15"
ctrlc = { version = "3", features = ["termination"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
percent-encoding = "2"
base64 = "0.22"
# SHA-256 for the project trust store; already built for rustls.
ring = "0.17"

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[[bin]]
name = "model-router"
path = "src/main.rs"
