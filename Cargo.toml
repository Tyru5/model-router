[package]
name = "model-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A terminal workflow router for agentic harnesses and models"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "6"
fs2 = "0.4"
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
strip-ansi-escapes = "0.2"
tempfile = "3"
toml = "0.8"
tui-textarea = "0.7"
uuid = { version = "1", features = ["v4"] }
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "model-router"
path = "src/main.rs"
