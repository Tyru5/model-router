# Harness output fixtures for handoff::normalize. tests/harness_output.rs runs
# every entry; `model-router doctor` reports these versions as parser-tested.
#
# provenance: "captured" is sanitized real output (scripts/capture_harness_output.py);
# "schema-derived" is built from documented or installed-source event shapes.
# Expectations: text_contains/text_excludes apply to the normalized text;
# error_contains (absent means no error); permission_blocked (default false);
# handoff_summary means handoff::parse succeeds with that summary (role
# defaults to implementation; verdict is checked when given).

