name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-fail-fast

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  smoke:
    name: Terminal smoke tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # All scripts are portable (PTY/termios only, /proc checks gated to Linux).
    # macOS stays advisory until it has a record of green runs.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    env:
      SMOKE: uv run --with-requirements scripts/requirements-smoke.txt python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: scripts/requirements-smoke.txt
      - run: cargo build --locked
      - name: Workflow
        run: $SMOKE scripts/smoke_tui.py
      - name: Repository browser
        run: $SMOKE scripts/smoke_repos.py
      - name: Task imports
        run: $SMOKE scripts/smoke_imports.py
      - name: Stage presets
        run: $SMOKE scripts/smoke_stages.py
      - name: Themes
        run: $SMOKE scripts/smoke_themes.py
      - name: Harness settings
        run: $SMOKE scripts/smoke_harness_settings.py
      - name: Startup animation
        run: $SMOKE scripts/smoke_startup.py
      - name: Getting-started tour
        run: $SMOKE scripts/smoke_tour.py
      - name: Native terminal detach and reattach
        run: $SMOKE scripts/smoke_detach.py
      - name: Diff review and external tools
        run: $SMOKE scripts/smoke_review.py
      - name: Delegated tasks
        run: $SMOKE scripts/smoke_delegation.py
      # Plain python3: the raw-PTY harness must not need pyte.
      - name: Terminal disconnect and shutdown
        run: python3 scripts/smoke_shutdown.py
      - name: Upload screen captures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-captures-${{ matrix.os }}
          path: .model-router/qa/
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Advisories appear without code changes; report them, don't block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # rustsec/audit-check failed to update its own check run ("Not Found").
      # Plain cargo-audit fails only on vulnerabilities and prints warnings.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
