# Publish the Homebrew formula from a finished release to the tap.
# Skipped unless the HOMEBREW_TAP_TOKEN secret is set (a token with
# contents:write on the tap repo). Runs after the dist Release workflow, or by
# hand for an existing tag.
name: Homebrew tap

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.0)
        required: true

permissions:
  contents: read

env:
  TAP: Tyru5/homebrew-tap

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.token.outputs.enabled }}
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::HOMEBREW_TAP_TOKEN not set; the formula stays on the GitHub release only"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      # Tag pushes report the tag as the run's head branch.
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Download formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Formula
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.rb' --dir Formula --clobber
      - name: Commit formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          if git diff --cached --quiet; then
            echo "Formula unchanged"
            exit 0
          fi
          git commit -m "model-router ${TAG#v}"
          git push
